$kind: http-request
url: "{{baseUrl}}/reportes/productos-top?limite=5"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  limite: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Productos top (HTTP 200)', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().productos).to.be.an('array');
      });
    language: text/javascript
examples: .resources/7.2 Productos mas vendidos.resources/examples
order: 2000
