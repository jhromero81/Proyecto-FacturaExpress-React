$kind: http-request
url: "{{baseUrl}}/usuarios"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Listado de usuarios (HTTP 200)', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().usuarios).to.be.an('array');
      });
    language: text/javascript
examples: .resources/9.1 Listar usuarios.resources/examples
order: 1000
